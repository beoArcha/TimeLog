<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>oXyFlow Documentation & Wiki</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="oXyFlow - Fast, lightweight desktop timer and task tracker. Documentation, user guides, and architecture wiki.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏱️</text></svg>">
  
  <!-- Theme: Docsify Themeable (modern and easily customizable) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">

  <style>
    :root {
      --base-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", sans-serif;
      --base-font-size: 15px;
      --base-line-height: 1.6;
      --theme-color: #10b981;
      --link-color: #38bdf8;
      --link-color--hover: #7dd3fc;
      --sidebar-width: 280px;
      --sidebar-background: #0f172a;
      --sidebar-border-color: #1e293b;
      --sidebar-name-color: #f8fafc;
      --sidebar-nav-link-color: #94a3b8;
      --sidebar-nav-link-color--hover: #f1f5f9;
      --sidebar-nav-link-color--active: #10b981;
      --content-max-width: 900px;
      --code-font-family: "JetBrains Mono", Consolas, Monaco, "Andale Mono", monospace;
      --code-theme-background: #1e293b;
      --code-theme-text: #f1f5f9;
      --table-row-odd-background: #1e293b;
      --table-border-color: #334155;
    }

    body {
      background-color: #0b0f19;
      color: #e2e8f0;
    }

    .app-name-link {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .sidebar {
      border-right: 1px solid #1e293b;
    }

    .markdown-section blockquote {
      border-left: 4px solid var(--theme-color);
      background: rgba(16, 185, 129, 0.08);
      padding: 0.75rem 1rem;
      border-radius: 0 0.375rem 0.375rem 0;
    }

    .markdown-section table {
      border-collapse: collapse;
      width: 100%;
      margin: 1.5rem 0;
    }

    .markdown-section table th {
      background-color: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 0.6rem 0.8rem;
    }

    .markdown-section table td {
      border: 1px solid #334155;
      padding: 0.6rem 0.8rem;
    }

    .docsify-copy-code-button {
      background-color: #334155 !important;
      color: #f8fafc !important;
      border-radius: 4px !important;
    }
  </style>
</head>
<body>
  <div id="app">Loading oXyFlow documentation...</div>
  <script>
    window.$docsify = {
      name: '⏱️ oXyFlow Wiki',
      repo: 'https://github.com/beoArcha/TimeLog',
      homepage: 'Home.md',
      loadSidebar: '_Sidebar.md',
      subMaxLevel: 3,
      auto2top: true,
      alias: {
        '/.*/_sidebar.md': '/_Sidebar.md',
        '/.*/_Sidebar.md': '/_Sidebar.md',
        '/.*/_footer.md': '/_Footer.md',
        '/.*/_Footer.md': '/_Footer.md'
      },
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: {
          '/pl/': 'Szukaj w dokumentacji...',
          '/de/': 'Dokumentation durchsuchen...',
          '/es/': 'Buscar en la documentación...',
          '/fr/': 'Rechercher dans la documentation...',
          '/pt-br/': 'Pesquisar na documentação...',
          '/': 'Search documentation...'
        },
        noData: {
          '/pl/': 'Brak wyników',
          '/de/': 'Keine Ergebnisse',
          '/es/': 'No se encontraron resultados',
          '/fr/': 'Aucun résultat',
          '/pt-br/': 'Nenhum resultado',
          '/': 'No results found'
        },
        depth: 4
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      }
    };
  </script>

  <!-- Docsify v4 core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <!-- Search plugin -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <!-- Copy code plugin -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
  <!-- Themeable plugin -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>
  <!-- Prism language syntax highlighters -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-powershell.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-rust.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-markdown.min.js"></script>
</body>
</html>
