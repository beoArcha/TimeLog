      <h1>TimeLog by oXyFlow — Local-First Time Tracking</h1>
      <p>TimeLog is a lightweight, local-first work timer and task tracker. Track working hours, organize projects and tasks, and review your time without relying on a hosted account.</p>
      <h2>One time tracker, desktop and web</h2>
      <ul>
        <li><strong>Desktop:</strong> native application for Windows, macOS and Linux, built with Rust and Tauri v2.</li>
        <li><strong>Web and PWA:</strong> launch TimeLog in a modern browser or install it as a Progressive Web App.</li>
        <li><strong>Time tracking:</strong> start, pause and switch work sessions with project and task context.</li>
        <li><strong>CLI:</strong> automate time tracking and reporting with the companion <code>oxy</code> command-line tool.</li>
        <li><strong>Multilingual interface:</strong> English, Polish, German, Spanish, French and Brazilian Portuguese.</li>
      </ul>

  <script>
    (function () {
      var languages = ['en', 'pl', 'de', 'es', 'fr', 'pt-br'];
      var storageKey = 'timelog-docs-language';
      var languagePattern = /^#?\/(en|pl|de|es|fr|pt-br)(?:\/|$)/i;

      function normalizeLanguage(value) {
        if (!value) return 'en';
        var normalized = value.toLowerCase();
        if (normalized.startsWith('pt')) return 'pt-br';
        var shortCode = normalized.split('-')[0];
        return languages.indexOf(shortCode) >= 0 ? shortCode : 'en';
      }

      function getPreferredLanguage() {
        try {
          var saved = localStorage.getItem(storageKey);
          if (saved && languages.indexOf(saved) >= 0) return saved;
        } catch (_) {}
        var candidates = navigator.languages && navigator.languages.length
          ? navigator.languages
          : [navigator.language || 'en'];
        for (var i = 0; i < candidates.length; i++) {
          var candidate = normalizeLanguage(candidates[i]);
          if (candidate !== 'en' || String(candidates[i]).toLowerCase().startsWith('en')) return candidate;
        }
        return 'en';
      }

      function isRootRoute(hash) {
        return !hash || hash === '#' || hash === '#/' || hash === '#/README' || hash === '#/README.md';
      }

      if (isRootRoute(window.location.hash)) {
        var preferred = getPreferredLanguage();
        if (preferred !== 'en') window.location.replace(window.location.pathname + window.location.search + '#/' + preferred + '/README.md');
      }

      document.addEventListener('click', function (event) {
        var link = event.target && event.target.closest ? event.target.closest('a[href]') : null;
        if (!link) return;
        var href = link.getAttribute('href') || '';
        var target = href.match(languagePattern);
        if (!target) return;

        var language = target[1].toLowerCase();
        try { localStorage.setItem(storageKey, language); } catch (_) {}

        var current = window.location.hash.replace(/^#\/?/, '').split('?')[0];
        var parts = current.split('/');
        var currentSlug = parts.length > 1 && languages.indexOf(parts[0].toLowerCase()) >= 0
          ? parts.slice(1).join('/')
          : 'README.md';
        if (!currentSlug || currentSlug === 'README' || currentSlug === 'README.md') currentSlug = 'README.md';

        event.preventDefault();
        window.location.hash = '#/' + language + '/' + currentSlug;
      }, true);
    })();
