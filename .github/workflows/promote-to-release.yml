name: Promote to Release
on:
  workflow_dispatch:

env:
  NODE_VERSION: '22'

jobs:
  style-check:
    name: Code Style & Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Check Frontend Linting
        run: npm run lint

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: Install Linux dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Check Rust Formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Cargo Clippy (Rust Linter)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

  promote:
    name: Promote and Bump Versions
    runs-on: ubuntu-latest
    needs: style-check
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Promote to Release Branch
        run: |
          # Fetch all branches to ensure we have the latest release branch
          git fetch origin
          
          # Try to checkout release branch, create if it doesn't exist
          git checkout release || git checkout -b release
          
          # Merge main into release (prefer fast-forward or create a merge commit)
          git merge origin/main --no-edit
          
          # Bump release version to odd minor
          node scripts/bump_versions.js --to-odd-minor
          
          # Commit the version bump on release
          git commit -am "chore(release): bump version to odd minor [skip ci]" || echo "No changes to commit on release"
          git push origin release

      - name: Bump Main Branch Version
        run: |
          # Switch back to main
          git checkout main
          
          # Make sure it's up to date
          git pull origin main
          
          # Bump main version to even minor
          node scripts/bump_versions.js --to-even-minor
          
          # Commit the version bump on main
          git commit -am "chore(version): bump main to next even minor [skip ci]" || echo "No changes to commit on main"
          git push origin main
