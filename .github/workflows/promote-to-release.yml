name: Promote to Release

on:
  workflow_dispatch:

concurrency:
  group: promote-to-release
  cancel-in-progress: false

env:
  NODE_VERSION: 24

jobs:
  promote:
    name: Promote Main → Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Promote to Release Branch
        run: |
          git fetch origin

          # Checkout release branch, or create it if it doesn't exist
          git checkout release || git checkout -b release

          # Merge main into release resolving conflicts in favor of main (theirs)
          git merge origin/main --no-edit -X theirs

          # Bump release version to odd minor
          node scripts/bump_versions.js --release

          # Commit the version bump on release
          git commit -am "chore(release): bump version to odd minor [skip ci]" || echo "No changes to commit on release"
          git push origin release

      - name: Bump Main Branch Version
        run: |
          git checkout main
          git pull --ff-only origin main

          # Bump main version to even minor
          node scripts/bump_versions.js --main

          git commit -am "chore(version): bump main to next even minor [skip ci]" || echo "No changes to commit on main"
          git push origin main

      - name: 📦 Release Ready – manual trigger required
        run: |
          echo ""
          echo "=============================================="
          echo "  ✅  Promote to Release completed!"
          echo ""
          echo "  Code has been merged to the 'release' branch"
          echo "  and versions have been bumped."
          echo ""
          echo "  👉  To test, build, tag & publish, run:"
          echo "      gh workflow run release.yml --ref release"
          echo "      (or Actions → 'Release' → Run workflow)"
          echo "=============================================="
          echo ""
