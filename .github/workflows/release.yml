name: Release

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  RUST_WORKSPACE: "src-tauri -> target"
  CARGO_PROFILE_DEV_DEBUG: 0

  UBUNTU_PACKAGES: >-
    pkg-config
    libgtk-3-dev
    libwebkit2gtk-4.1-dev
    libappindicator3-dev
    librsvg2-dev
    patchelf

  UBUNTU_PACKAGES_LLD: >-
    pkg-config
    libgtk-3-dev
    libwebkit2gtk-4.1-dev
    libappindicator3-dev
    librsvg2-dev
    patchelf
    lld

jobs:
  # ──────────────────────────────────────────────
  # Unit tests
  # ──────────────────────────────────────────────
  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Node.js Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: |
          npx vitest run tests/unit \
            --coverage \
            --coverage.reporter=json \
            --coverage.reportsDirectory=coverage/unit

          mv coverage/unit/coverage-final.json coverage/unit/coverage-unit.json

      - name: Upload Unit Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/unit/coverage-unit.json

  # ──────────────────────────────────────────────
  # Integration tests
  # ──────────────────────────────────────────────

  test-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Node.js Dependencies
        run: npm ci

      - name: Run Integration Tests
        run: |
          npx vitest run tests/integration \
            --coverage \
            --coverage.reporter=json \
            --coverage.reportsDirectory=coverage/integration

          mv coverage/integration/coverage-final.json coverage/integration/coverage-integration.json

      - name: Upload Integration Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: coverage/integration/coverage-integration.json

  # ──────────────────────────────────────────────
  # Rust tests + coverage
  # ──────────────────────────────────────────────

  test-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.RUST_WORKSPACE }}

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.UBUNTU_PACKAGES_LLD }}

      - name: Run Rust Tests
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=lld"

        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Upload Rust Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-rust
          path: coverage/rust

  # ──────────────────────────────────────────────
  # Build for Windows, macOS, Linux
  # ──────────────────────────────────────────────
  build-tauri:
    name: Build Tauri Artifacts
    needs: [test-unit, test-integration, test-rust]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""

          - platform: "macos-latest"
            args: "--target universal-apple-darwin"

          - platform: "ubuntu-22.04"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.UBUNTU_PACKAGES }}

      - name: Restore Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.RUST_WORKSPACE }}

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Tauri Artifacts
        uses: tauri-apps/tauri-action@v0
        id: tauri_build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: "App v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify Bundle
        if: always()
        shell: bash
        run: |
          if [ ! -d src-tauri/target/release/bundle ]; then
            echo "::error::Bundle directory not generated"
              exit 1
            fi

      - name: Upload Windows Standalone Executable
        if: matrix.platform == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          EXE_PATH=$(find src-tauri/target -maxdepth 4 -name "OxyFlow.exe" -o -name "oxy-flow.exe" | head -n 1)
          if [ -f "$EXE_PATH" ]; then
            cp "$EXE_PATH" src-tauri/target/OxyFlow-Standalone-x64.exe
            gh release upload "app-v${{ steps.tauri_build.outputs.appVersion }}" src-tauri/target/OxyFlow-Standalone-x64.exe --clobber || true
          else
            echo "Warning: Could not find compiled Windows executable for standalone upload"
          fi

      - name: List Built Artifacts (debug)
        if: always()
        shell: bash
        run: |
          echo "::group::Target"
          find src-tauri/target -maxdepth 3
          echo "::endgroup::"
          echo "::group::Release"
          ls -R src-tauri/target/release || true
          echo "::endgroup::"
          echo "::group::Bundle"
          ls -R src-tauri/target/release/bundle || true
          echo "::endgroup::"

      - name: Collect artifact paths
        id: collect
        shell: bash
        run: |
          ARTIFACT_DIR="artifacts-upload"
          mkdir -p "$ARTIFACT_DIR"

          copy() {
            find src-tauri/target -path "$1" -exec cp {} "$ARTIFACT_DIR/" \;
          }

          # Find all relevant bundle files and copy them to a flat directory
          if [ "${{ matrix.platform }}" == "ubuntu-22.04" ]; then
            copy "*/bundle/deb/*.deb"
            copy "*/bundle/rpm/*.rpm"
            copy "*/bundle/appimage/*.AppImage"
            copy "*/bundle/appimage/*.AppImage.tar.gz"
          elif [ "${{ matrix.platform }}" == "windows-latest" ]; then
            copy "*/bundle/msi/*.msi"
            copy "*/bundle/nsis/*.exe"
          elif [ "${{ matrix.platform }}" == "macos-latest" ]; then
            copy "*/bundle/dmg/*.dmg"
            copy "*/bundle/macos/*.app"
          fi

          echo "=== Collected artifacts ==="
          ls -la "$ARTIFACT_DIR/" || echo "No artifacts collected"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-artifacts-${{ matrix.platform }}
          path: artifacts-upload/
          if-no-files-found: warn
