name: Auto Release
on:
  workflow_run:
    workflows: ["Tests"]
    types:
      - completed
    branches: [ "main" ]

jobs:
  release:
    name: Auto Release & Version Bump
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2
        
    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        
    - name: Bump versions
      run: node scripts/bump_versions.js
      
    - name: Commit version bump
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git commit -am "chore(release): bump version [skip ci]" || echo "No changes to commit"
        git push
