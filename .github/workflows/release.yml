name: Release

on:
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # ──────────────────────────────────────────────
  # 1. Run tests on the release branch (no lint)
  # ──────────────────────────────────────────────
  test-release:
    name: Tests on Release Branch
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: release

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: Install Linux dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf lld

      - name: Run Frontend Tests
        run: npx vitest run tests --exclude tests/end-to-end.test.tsx

      - name: Run E2E Tests
        run: npx vitest run tests/end-to-end.test.tsx

      - name: Run Rust Tests
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
        run: |
          cd src-tauri
          cargo test

  # ──────────────────────────────────────────────
  # 2. Build for Windows, macOS, Linux
  # ──────────────────────────────────────────────
  build-tauri:
    name: Build Tauri Artifacts
    needs: test-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install webkit2gtk and other deps (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"

      - name: install frontend dependencies
        run: npm ci || npm install

      # NOTE: Do NOT run "npm run build" here — tauri-action handles the full build pipeline
      - uses: tauri-apps/tauri-action@v0
        id: tauri_build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx tauri
          tagName: app-v__VERSION__
          releaseName: 'App v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Windows Standalone Executable
        if: matrix.platform == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          EXE_PATH=$(find src-tauri/target -maxdepth 4 -name "OxyFlow.exe" -o -name "oxy-flow.exe" | head -n 1)
          if [ -f "$EXE_PATH" ]; then
            cp "$EXE_PATH" src-tauri/target/OxyFlow-Standalone-x64.exe
            gh release upload "app-v${{ steps.tauri_build.outputs.appVersion }}" src-tauri/target/OxyFlow-Standalone-x64.exe --clobber || true
          else
            echo "Warning: Could not find compiled Windows executable for standalone upload"
          fi

      - name: List built artifacts (debug)
        if: always()
        shell: bash
        run: |
          echo "=== Listing all bundle artifacts ==="
          find src-tauri/target -path "*/bundle/*" -type f 2>/dev/null || echo "No bundle directory found"

      - name: Collect artifact paths
        id: collect
        shell: bash
        run: |
          ARTIFACT_DIR="artifacts-upload"
          mkdir -p "$ARTIFACT_DIR"

          # Find all relevant bundle files and copy them to a flat directory
          if [ "${{ matrix.platform }}" == "ubuntu-22.04" ]; then
            find src-tauri/target -path "*/bundle/deb/*.deb" -exec cp {} "$ARTIFACT_DIR/" \;
            find src-tauri/target -path "*/bundle/rpm/*.rpm" -exec cp {} "$ARTIFACT_DIR/" \;
            find src-tauri/target -path "*/bundle/appimage/*.AppImage" -exec cp {} "$ARTIFACT_DIR/" \;
            find src-tauri/target -path "*/bundle/appimage/*.AppImage.tar.gz" -exec cp {} "$ARTIFACT_DIR/" \;
          elif [ "${{ matrix.platform }}" == "windows-latest" ]; then
            find src-tauri/target -path "*/bundle/msi/*.msi" -exec cp {} "$ARTIFACT_DIR/" \;
            find src-tauri/target -path "*/bundle/nsis/*.exe" -exec cp {} "$ARTIFACT_DIR/" \;
          elif [ "${{ matrix.platform }}" == "macos-latest" ]; then
            find src-tauri/target -path "*/bundle/dmg/*.dmg" -exec cp {} "$ARTIFACT_DIR/" \;
            find src-tauri/target -path "*/bundle/macos/*.app" -exec cp -r {} "$ARTIFACT_DIR/" \;
          fi

          echo "=== Collected artifacts ==="
          ls -la "$ARTIFACT_DIR/" || echo "No artifacts collected"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-artifacts-${{ matrix.platform }}
          path: artifacts-upload/
          if-no-files-found: warn
