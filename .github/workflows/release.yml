name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  RUST_WORKSPACE: "src-tauri"
  CARGO_PROFILE_DEV_DEBUG: 0

  UBUNTU_PACKAGES_LLD: >-
    pkg-config
    libgtk-3-dev
    libwebkit2gtk-4.1-dev
    libappindicator3-dev
    librsvg2-dev
    patchelf
    lld

jobs:
  # ──────────────────────────────────────────────
  # Checking commit
  # ──────────────────────────────────────────────
  prepare:
    name: Resolve release commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: release

      - name: Read version and validate
        id: meta
        run: |
          SHA=$(git rev-parse HEAD)
          VERSION=$(jq -r .version package.json)
          TAG="app-v${VERSION}"
          MINOR=$(echo "$VERSION" | cut -d. -f2)

          # release ma nieparzysty minor, main parzysty
          if [ $((MINOR % 2)) -eq 0 ]; then
            echo "::error::Branch 'release' has version ${VERSION} (even minor). Run 'Promote to Release' first."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists. Run 'Promote to Release' to bump the version first."
            exit 1
          fi

          {
            echo "sha=${SHA}"
            echo "version=${VERSION}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing ${TAG} from ${SHA}"

  # ──────────────────────────────────────────────
  # Testing
  # ──────────────────────────────────────────────
  tests:
    name: Tests
    needs: prepare
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  # ──────────────────────────────────────────────
  # Build for Windows, macOS, Linux
  # ──────────────────────────────────────────────
  build-tauri:
    name: Build (${{ matrix.platform }})
    needs: [prepare, tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            bundles: nsis
            args: ""

          - platform: "macos-latest"
            bundles: dmg
            args: "--target universal-apple-darwin"

          - platform: "ubuntu-22.04"
            bundles: deb,rpm,appimage
            args: ""

    runs-on: ${{ matrix.platform }}
    env:
      APP_VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ env.UBUNTU_PACKAGES_LLD }}

      - name: Restore Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.RUST_WORKSPACE }}

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      - name: Build Tauri Artifacts
        env:
          RUSTFLAGS: ${{ matrix.platform == 'ubuntu-22.04' && '-C link-arg=-fuse-ld=lld' || '' }}
        run: bun x tauri build ${{ matrix.args }} --bundles ${{ matrix.bundles }}

      - name: List Built Artifacts (debug)
        if: failure()
        shell: bash
        run: |
          echo "::group::Target"
          find src-tauri/target -maxdepth 3
          echo "::endgroup::"
          echo "::group::Release"
          ls -R src-tauri/target/release || true
          echo "::endgroup::"
          echo "::group::Bundle"
          ls -R src-tauri/target/release/bundle || true
          echo "::endgroup::"

      - name: Collect artifacts
        shell: bash
        run: |
          ARTIFACT_DIR="artifacts-upload"
          mkdir -p "$ARTIFACT_DIR"

          copy() {
            find src-tauri/target -type f -path "$1" -exec cp {} "$ARTIFACT_DIR/" \;
          }

          case "${{ matrix.platform }}" in
            ubuntu-22.04)
              copy "*/bundle/deb/*.deb"
              copy "*/bundle/rpm/*.rpm"
              copy "*/bundle/appimage/*.AppImage"
              copy "*/bundle/appimage/*.AppImage.tar.gz"
              ;;
            windows-latest)
              copy "*/bundle/nsis/*.exe"

              EXE_PATH=$(find src-tauri/target -maxdepth 4 -type f \( -name "OxyFlow.exe" -o -name "oxy-flow.exe" \) | head -n 1)
              if [ -n "$EXE_PATH" ]; then
                cp "$EXE_PATH" "$ARTIFACT_DIR/OxyFlow-Standalone-x64-v${APP_VERSION}.exe"
              else
                echo "::warning::Standalone Windows executable not found"
              fi
              ;;
            macos-latest)
              copy "*/bundle/dmg/*.dmg"
              ;;
          esac

          echo "=== Collected artifacts ==="
          ls -la "$ARTIFACT_DIR"
          [ -n "$(ls -A "$ARTIFACT_DIR")" ] || { echo "::error::No artifacts collected"; exit 1; }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-artifacts-${{ matrix.platform }}
          path: artifacts-upload/
          if-no-files-found: error
          retention-days: 7

  # ──────────────────────────────────────────────
  # Tag on GitHub Release
  # ──────────────────────────────────────────────
  publish:
    name: Tag & GitHub Release
    needs: [prepare, build-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.prepare.outputs.tag }}
      SHA: ${{ needs.prepare.outputs.sha }}
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tauri-artifacts-*
          path: release-assets
          merge-multiple: true

      - name: Verify assets
        run: |
          ls -la release-assets
          [ -n "$(ls -A release-assets)" ] || { echo "::error::No assets to publish"; exit 1; }

      - name: Generate SHA256 Checksums
        run: |
          cd release-assets
          for f in *; do
            if [ -f "$f" ] && [ "$f" != "SHA256SUMS.txt" ]; then
              sha256sum "$f"
            fi
          done > SHA256SUMS.txt
          echo "=== SHA256SUMS.txt ==="
          cat SHA256SUMS.txt
          cd ..

          {
            echo "### Cryptographic Checksums (SHA-256)"
            echo ""
            echo "| File | SHA-256 Checksum |"
            echo "| :--- | :--- |"
            awk '{print "| `" $2 "` | `" $1 "` |"}' release-assets/SHA256SUMS.txt
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create tag and GitHub Release
        run: |
          # --target z pełnym SHA tworzy tag dokładnie na zbudowanym commicie z release
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "OxyFlow v${VERSION}" \
            --generate-notes

          {
            echo "### Released ${TAG}"
            echo ""
            echo "Commit: \`${SHA}\`"
            echo "All release artifacts and \`SHA256SUMS.txt\` published successfully."
          } >> "$GITHUB_STEP_SUMMARY"
