name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # Checking commit & release metadata
  # ──────────────────────────────────────────────
  prepare:
    name: Resolve release commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      # Always force checkout of the release branch regardless of UI dispatch selection
      - uses: ./.github/actions/checkout-release
        with:
          ref: release

      - name: Read version and validate
        id: meta
        shell: bash
        run: |
          SHA=$(git rev-parse HEAD)
          VERSION=$(jq -r .version package.json)
          TAG="app-v${VERSION}"
          MINOR=$(echo "$VERSION" | cut -d. -f2)

          # Release branches enforce odd minor version numbers, main uses even
          if [ $((MINOR % 2)) -eq 0 ]; then
            echo "::error::Branch 'release' has version ${VERSION} (even minor). Run 'Promote to Release' first."
            exit 1
          fi

          # Prevent overwriting an already published git tag
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists. Run 'Promote to Release' to bump the version first."
            exit 1
          fi

          {
            echo "sha=${SHA}"
            echo "version=${VERSION}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing ${TAG} from ${SHA}"

  # ──────────────────────────────────────────────
  # Fast Release Pre-Flight Verification Gate
  # ──────────────────────────────────────────────
  pre-flight:
    name: Pre-Flight Gate
    needs: prepare
    uses: ./.github/workflows/verify-release.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  # ──────────────────────────────────────────────
  # Build for Windows, macOS, Linux
  # ──────────────────────────────────────────────
  build-tauri:
    name: Build Packages
    needs: [prepare, pre-flight]
    uses: ./.github/workflows/build-tauri.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}

  # ──────────────────────────────────────────────
  # Tag on GitHub Release
  # ──────────────────────────────────────────────
  publish:
    name: Tag & GitHub Release
    needs: [prepare, build-tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.prepare.outputs.tag }}
      SHA: ${{ needs.prepare.outputs.sha }}
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tauri-artifacts-*
          path: release-assets
          merge-multiple: true

      - name: Verify assets
        shell: bash
        run: |
          ls -la release-assets
          [ -n "$(ls -A release-assets)" ] || { echo "::error::No assets to publish"; exit 1; }

      - name: Generate SHA256 Checksums
        shell: bash
        run: |
          cd release-assets
          for f in *; do
            if [ -f "$f" ] && [ "$f" != "SHA256SUMS.txt" ]; then
              sha256sum "$f"
            fi
          done > SHA256SUMS.txt
          echo "=== SHA256SUMS.txt ==="
          cat SHA256SUMS.txt
          cd ..

          {
            echo "### Cryptographic Checksums (SHA-256)"
            echo ""
            echo "| File | SHA-256 Checksum |"
            echo "| :--- | :--- |"
            awk '{print "| `" $2 "` | `" $1 "` |"}' release-assets/SHA256SUMS.txt
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create tag and GitHub Release
        shell: bash
        run: |
          # Passing full SHA ensures the tag is anchored to the exact validated commit
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "OxyFlow v${VERSION}" \
            --generate-notes

          {
            echo "### Released ${TAG}"
            echo ""
            echo "Commit: \`${SHA}\`"
            echo "All release artifacts and \`SHA256SUMS.txt\` published successfully."
          } >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────
  # Deploy Documentation to GitHub Pages
  # ──────────────────────────────────────────────
  deploy-pages:
    name: Deploy Wiki
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
