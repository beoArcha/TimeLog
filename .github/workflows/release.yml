name: Auto Release
on:
  workflow_run:
    workflows: ["Tests"]
    types:
      - completed
    branches: [ "main" ]

env:
  NODE_VERSION: '22'
  TARGET_DIR: src-tauri/target/release
  BUNDLE_DIR: src-tauri/target/release/bundle

jobs:
  release:
    name: Auto Release & Version Bump
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2
        
    - name: Use Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        
    - name: Bump versions
      run: node scripts/bump_versions.js
      
    - name: Commit version bump
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git commit -am "chore(release): bump version [skip ci]" || echo "No changes to commit"
        git push

  build-tauri:
    name: Build Tauri Artifacts
    needs: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install webkit2gtk (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ${{ env.TARGET_DIR }}/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: install frontend dependencies
        run: npm ci || npm install

      - name: build frontend assets
        run: npm run build

      - uses: tauri-apps/tauri-action@v0
        id: tauri_build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version.
          releaseName: 'App v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Windows Standalone Executable
        if: matrix.platform == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cp ${{ env.TARGET_DIR }}/oxy-flow.exe ${{ env.TARGET_DIR }}/OxyFlow-Standalone-x64.exe || cp ${{ env.TARGET_DIR }}/OxyFlow.exe ${{ env.TARGET_DIR }}/OxyFlow-Standalone-x64.exe || true
          gh release upload "app-v${{ steps.tauri_build.outputs.appVersion }}" ${{ env.TARGET_DIR }}/OxyFlow-Standalone-x64.exe --clobber || true

      - name: Parse artifact paths
        id: artifact_paths
        shell: bash
        run: |
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "paths<<$EOF" >> $GITHUB_OUTPUT
          if [ "${{ matrix.platform }}" == "ubuntu-22.04" ]; then
            echo "${{ env.BUNDLE_DIR }}/**/*.deb" >> $GITHUB_OUTPUT
            echo "${{ env.BUNDLE_DIR }}/**/*.AppImage" >> $GITHUB_OUTPUT
            echo "${{ env.BUNDLE_DIR }}/**/*.rpm" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.platform }}" == "windows-latest" ]; then
            echo "${{ env.BUNDLE_DIR }}/**/*.exe" >> $GITHUB_OUTPUT
            echo "${{ env.BUNDLE_DIR }}/**/*.msi" >> $GITHUB_OUTPUT
            echo "${{ env.TARGET_DIR }}/OxyFlow-Standalone-x64.exe" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.platform }}" == "macos-latest" ]; then
            echo "${{ env.BUNDLE_DIR }}/**/*.dmg" >> $GITHUB_OUTPUT
            echo "${{ env.BUNDLE_DIR }}/**/*.app" >> $GITHUB_OUTPUT
          fi
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-artifacts-${{ matrix.platform }}
          path: ${{ steps.artifact_paths.outputs.paths }}
          if-no-files-found: warn
