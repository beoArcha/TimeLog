name: Backport Fixes (Fix Down)

on:
  pull_request:
    types: [closed]
    branches:
      - release

concurrency:
  group: fix-down-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  backport:
    if: github.event.pull_request.merged == true && !contains(github.event.pull_request.title, 'chore(release)')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Cherry-pick onto a backport branch
        id: backport
        run: |
          set -euo pipefail

          BRANCH_NAME="backport-${PR_NUMBER}-${GITHUB_RUN_ID}"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

          git checkout -b "$BRANCH_NAME"

          # Merge commit ma 2 rodziców (-m 1), squash ma 1 rodzica (bez -m)
          WORDS=$(git rev-list --parents -n 1 "$MERGE_SHA" | wc -w)
          if [ "$WORDS" -gt 2 ]; then
            PICK_ARGS="-m 1"
          else
            PICK_ARGS=""
          fi

          # --no-commit: najpierw wycofamy pliki wersji, dopiero potem commit
          if ! git cherry-pick --no-commit $PICK_ARGS "$MERGE_SHA"; then
            gh pr comment "$PR_NUMBER" --body "⚠️ Automatic backport to \`main\` failed (conflict). Please cherry-pick \`$MERGE_SHA\` to \`main\` manually."
            echo "::error::Cherry-pick of $MERGE_SHA onto main has conflicts – manual backport required."
            exit 1
          fi

          # Pliki wersji zostają takie, jak na main (każdy plik osobno,
          # żeby brak jednego nie blokował reszty)
          for f in package.json bun.lock src/versions.json src-tauri/tauri.conf.json src-tauri/Cargo.toml; do
            if git cat-file -e "origin/main:$f" 2>/dev/null; then
              git checkout origin/main -- "$f"
            fi
          done

          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing to backport (changes already on main or only version files)."
            exit 0
          fi

          AUTHOR=$(git log -1 --format='%an <%ae>' "$MERGE_SHA")
          git commit --author="$AUTHOR" \
            -m "chore: backport hotfix #${PR_NUMBER} to main" \
            -m "Backport of: ${PR_TITLE}"

          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Push Backport Branch
        if: steps.backport.outputs.has_changes == 'true'
        env:
          BRANCH_NAME: ${{ steps.backport.outputs.branch_name }}
        run: git push origin "$BRANCH_NAME"

      - name: Create Pull Request
        if: steps.backport.outputs.has_changes == 'true'
        env:
          BRANCH_NAME: ${{ steps.backport.outputs.branch_name }}
        run: |
          gh pr create \
            --title "chore: backport hotfix #${PR_NUMBER} to main" \
            --body "This is an automated backport of PR #${PR_NUMBER}. Version files have been automatically excluded to preserve main's even minor version." \
            --head "$BRANCH_NAME" \
            --base main
