name: Build Web Application

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref or SHA to build"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref or branch to build"
        type: string
        required: false
        default: "release"

jobs:
  build:
    name: Build Web & PWA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Frontend
        uses: ./.github/actions/setup-frontend

      - name: Build Web Application
        run: bun run build:web

      - name: Verify Web Dist
        shell: bash
        run: |
          ls -la dist
          [ -f "dist/index.html" ] || { echo "::error::dist/index.html missing"; exit 1; }
          [ -f "dist/manifest.webmanifest" ] || { echo "::error::dist/manifest.webmanifest missing"; exit 1; }

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: timelog-web
          path: dist/
          if-no-files-found: error
          retention-days: 7
