name: Tests

on:
  push:
    branches: [ "main", "release" ]
    paths-ignore:
      - 'src/versions.json'
      - 'package.json'
      - 'package-lock.json'
      - 'src-tauri/tauri.conf.json'
  pull_request:
    branches: [ "main", "release" ]
    paths-ignore:
      - 'src/versions.json'
      - 'package.json'
      - 'package-lock.json'
      - 'src-tauri/tauri.conf.json'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: '22'
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # ──────────────────────────────────────────────
  # 1. Quality Checks (lint & typecheck)
  # ──────────────────────────────────────────────
  lint:
    name: Code Style & Lint Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci || npm install

    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "src-tauri"

    - name: Install Linux dependencies for Tauri
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

    # Generate full lint report (never fails the job)
    - name: Generate Lint Report
      continue-on-error: true
      run: |
        REPORT="lint-report.md"
        echo "# Lint & Style Report" > "$REPORT"
        echo "_Generated at $(date -u)_" >> "$REPORT"
        echo "" >> "$REPORT"

        # --- Frontend TypeScript Check ---
        echo "## Frontend – TypeScript Typecheck" >> "$REPORT"
        echo '```' >> "$REPORT"
        npm run lint 2>&1 | tee -a "$REPORT" || true
        echo '```' >> "$REPORT"
        echo "" >> "$REPORT"

        # --- Rust Formatting ---
        echo "## Rust – cargo fmt" >> "$REPORT"
        echo '```' >> "$REPORT"
        cargo fmt --manifest-path src-tauri/Cargo.toml -- --check 2>&1 | tee -a "$REPORT" || true
        echo '```' >> "$REPORT"
        echo "" >> "$REPORT"

        # --- Rust Clippy ---
        echo "## Rust – cargo clippy" >> "$REPORT"
        echo '```' >> "$REPORT"
        cargo clippy --manifest-path src-tauri/Cargo.toml 2>&1 | tee -a "$REPORT" || true
        echo '```' >> "$REPORT"

    - name: Upload Lint Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lint-report
        path: lint-report.md

  typecheck:
    name: Frontend Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci || npm install

    - name: Run TypeScript Typecheck
      run: npm run lint

  # ──────────────────────────────────────────────
  # 2. Testing Stage
  # ──────────────────────────────────────────────
  test-unit:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: [typecheck]
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci || npm install

    - name: Run Unit Tests with Coverage
      run: |
        npx vitest run tests/unit --coverage --coverage.reporter=json --coverage.reportsDirectory=coverage/unit --reporter=default --reporter=junit --outputFile.junit=unit-results.xml
        mv coverage/unit/coverage-final.json coverage/unit/coverage-unit.json || true

    - name: Upload Unit Coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-unit
        path: coverage/unit/coverage-unit.json

    - name: Publish Unit Test Report
      if: always()
      uses: mikepenz/action-junit-report@v4
      with:
        report_paths: 'unit-results.xml'

  test-integration:
    name: Frontend Integration Tests
    runs-on: ubuntu-latest
    needs: [typecheck]
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci || npm install

    - name: Run Integration Tests with Coverage
      run: |
        npx vitest run tests/integration --coverage --coverage.reporter=json --coverage.reportsDirectory=coverage/integration --reporter=default --reporter=junit --outputFile.junit=integration-results.xml
        mv coverage/integration/coverage-final.json coverage/integration/coverage-integration.json || true

    - name: Upload Integration Coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-integration
        path: coverage/integration/coverage-integration.json

    - name: Publish Integration Test Report
      if: always()
      uses: mikepenz/action-junit-report@v4
      with:
        report_paths: 'integration-results.xml'

  test-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    needs: [typecheck]
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci || npm install

    - name: Run E2E Tests with Coverage
      run: |
        npx vitest run tests/e2e/vitest --coverage --coverage.reporter=json --coverage.reportsDirectory=coverage/e2e --reporter=default --reporter=junit --outputFile.junit=e2e-results.xml
        mv coverage/e2e/coverage-final.json coverage/e2e/coverage-e2e.json || true

    - name: Upload E2E Coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-e2e
        path: coverage/e2e/coverage-e2e.json

    - name: Publish E2E Test Report
      if: always()
      uses: mikepenz/action-junit-report@v4
      with:
        report_paths: 'e2e-results.xml'

  test-rust:
    name: Rust Backend Tests
    runs-on: ubuntu-latest
    needs: [lint]
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "src-tauri"

    - name: Install cargo-tarpaulin
      uses: taiki-e/install-action@cargo-tarpaulin

    - name: Install Linux dependencies for Tauri
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf lld

    - name: Run Rust Tests with Coverage
      env:
        RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
      run: |
        cd src-tauri
        cargo tarpaulin --out Xml --output-dir ../coverage/rust

    - name: Upload Rust Coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-rust
        path: coverage/rust/

  # ──────────────────────────────────────────────
  # 3. Coverage Merging & Threshold Validation
  # ──────────────────────────────────────────────
  coverage-check:
    name: Coverage Threshold Check
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration, test-e2e]
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci || npm install

    - name: Download Unit Coverage
      uses: actions/download-artifact@v4
      with:
        name: coverage-unit
        path: coverage-reports/

    - name: Download Integration Coverage
      uses: actions/download-artifact@v4
      with:
        name: coverage-integration
        path: coverage-reports/

    - name: Download E2E Coverage
      uses: actions/download-artifact@v4
      with:
        name: coverage-e2e
        path: coverage-reports/

    - name: Merge and Check Coverage
      run: |
        npx nyc merge coverage-reports coverage-merged/coverage-final.json
        npx nyc report --temp-dir coverage-merged --reporter text --reporter json-summary
        npx nyc check-coverage --temp-dir coverage-merged --lines 70 --statements 75 --functions 75 --branches 65
      continue-on-error: true

  # ──────────────────────────────────────────────
  # 4. Build Stage
  # ──────────────────────────────────────────────
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration, test-e2e, test-rust]
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci || npm install

    - name: Build Production Bundle
      run: npm run build
