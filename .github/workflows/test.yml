name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  test-unit:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci || npm install
      
    - name: Run linting
      run: npm run lint
      
    - name: Run Unit Tests with Coverage
      run: npx vitest run tests --exclude tests/end-to-end.test.tsx --coverage --coverage.reportsDirectory=coverage/unit --reporter=default --reporter=junit --outputFile.junit=unit-results.xml
      
    - name: Upload Unit Coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-unit
        path: coverage/unit/
        
    - name: Publish Unit Test Report
      if: always()
      uses: mikepenz/action-junit-report@v4
      with:
        report_paths: 'unit-results.xml'

  test-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci || npm install
      
    - name: Run E2E Tests with Coverage
      run: npx vitest run tests/end-to-end.test.tsx --coverage --coverage.reportsDirectory=coverage/e2e --reporter=default --reporter=junit --outputFile.junit=e2e-results.xml
      
    - name: Upload E2E Coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-e2e
        path: coverage/e2e/
        
    - name: Publish E2E Test Report
      if: always()
      uses: mikepenz/action-junit-report@v4
      with:
        report_paths: 'e2e-results.xml'

  test-rust:
    name: Rust Backend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      
    - name: Install cargo-tarpaulin
      uses: taiki-e/install-action@cargo-tarpaulin
      
    - name: Generate Rust Project
      run: bash scripts/generate_rust_project.sh
      
    - name: Run Rust Tests with Coverage
      run: |
        cd src-tauri
        cargo tarpaulin --out Xml --output-dir ../coverage/rust
        
    - name: Upload Rust Coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-rust
        path: coverage/rust/

  release:
    name: Auto Release & Version Bump
    needs: [test-unit, test-e2e, test-rust]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2
        
    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        
    - name: Bump versions
      run: node scripts/bump_versions.js
      
    - name: Commit version bump
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git commit -am "chore(release): bump version [skip ci]" || echo "No changes to commit"
        git push

