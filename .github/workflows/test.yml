name: Tests

on:
  push:
    branches: [main, release]

  pull_request:
    branches: [main, release]

  workflow_call:
    inputs:
      ref:
        description: "Git ref or SHA to test (defaults to the triggering ref)"
        type: string
        required: false
        default: ""

concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  RUST_WORKSPACE: "src-tauri -> target"
  # Disabling debug symbol generation reduces linker memory and build duration in CI
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # ──────────────────────────────────────────────
  # Rust lint
  # ──────────────────────────────────────────────
  lint-rust:
    name: Lint (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
          install-linux-deps: "true"

      - name: Check formatting
        shell: bash
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Clippy
        shell: bash
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

  # ──────────────────────────────────────────────
  # Typecheck
  # ──────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-frontend

      - name: Typecheck
        shell: bash
        run: bun run typecheck

  # ──────────────────────────────────────────────
  # ESLint
  # ──────────────────────────────────────────────
  lint:
    name: Lint (Frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-frontend

      - name: Run ESLint
        shell: bash
        run: bun run lint

  # ──────────────────────────────────────────────
  # Unit tests
  # ──────────────────────────────────────────────
  test-unit:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-frontend

      - name: Run Unit Tests
        uses: ./.github/actions/test-frontend
        with:
          suite: unit
          coverage: "true"

  # ──────────────────────────────────────────────
  # Integration tests
  # ──────────────────────────────────────────────
  test-integration:
    name: Integration Tests (Vitest)
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-frontend

      - name: Run Integration Tests
        uses: ./.github/actions/test-frontend
        with:
          suite: integration
          coverage: "true"

  # ──────────────────────────────────────────────
  # Rust tests + coverage
  # ──────────────────────────────────────────────
  test-rust:
    name: Tests & Coverage (Rust)
    runs-on: ubuntu-latest
    needs: [lint-rust]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-rust
        with:
          install-linux-deps: "true"

      - name: Run Rust Tests & Coverage
        uses: ./.github/actions/test-rust
        with:
          run-coverage: "true"
          fail-under: "40"

  # ──────────────────────────────────────────────
  # Test & Coverage Reports (GitLab Style)
  # ──────────────────────────────────────────────
  reports:
    name: Test & Coverage Reports
    runs-on: ubuntu-latest
    # Run even if preceding test jobs encountered test failures, so reports are still rendered
    if: always() && !cancelled()
    needs:
      - test-unit
      - test-integration
      - test-rust
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-frontend

      - name: Generate Reports and Enforce Coverage
        uses: ./.github/actions/generate-test-reports
        with:
          gh-token: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          coverage-threshold: "40"
          enforce-coverage: "true"

  # ──────────────────────────────────────────────
  # Build
  # ──────────────────────────────────────────────
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs:
      - test-unit
      - test-integration
      - test-rust
      - reports
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-frontend

      - name: Build Application
        shell: bash
        run: bun run build
