name: Tests

on:
  push:
    branches: [ "main", "release" ]
    paths-ignore:
      - 'src/versions.json'
      - 'package.json'
      - 'package-lock.json'
      - 'src-tauri/tauri.conf.json'
  pull_request:
    branches: [ "main", "release" ]
    paths-ignore:
      - 'src/versions.json'
      - 'package.json'
      - 'package-lock.json'
      - 'src-tauri/tauri.conf.json'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: '22'
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  test-unit:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci || npm install
      
    - name: Run linting
      run: npm run lint
      
    - name: Run Unit Tests with Coverage
      run: npx vitest run tests --exclude tests/end-to-end.test.tsx --coverage --coverage.reportsDirectory=coverage/unit --reporter=default --reporter=junit --outputFile.junit=unit-results.xml
      
    - name: Upload Unit Coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-unit
        path: coverage/unit/
        
    - name: Publish Unit Test Report
      if: always()
      uses: mikepenz/action-junit-report@v4
      with:
        report_paths: 'unit-results.xml'

  test-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci || npm install
      
    - name: Run E2E Tests with Coverage
      run: npx vitest run tests/end-to-end.test.tsx --coverage --coverage.reportsDirectory=coverage/e2e --reporter=default --reporter=junit --outputFile.junit=e2e-results.xml
      
    - name: Upload E2E Coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-e2e
        path: coverage/e2e/
        
    - name: Publish E2E Test Report
      if: always()
      uses: mikepenz/action-junit-report@v4
      with:
        report_paths: 'e2e-results.xml'

  test-rust:
    name: Rust Backend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "src-tauri"
        
    - name: Install cargo-tarpaulin
      uses: taiki-e/install-action@cargo-tarpaulin
      
    - name: Install Linux dependencies for Tauri
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf lld
      
    - name: Run Rust Tests with Coverage
      env:
        RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
      run: |
        cd src-tauri
        cargo tarpaulin --out Xml --output-dir ../coverage/rust
        
    - name: Upload Rust Coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-rust
        path: coverage/rust/

