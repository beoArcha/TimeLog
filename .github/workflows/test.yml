name: Tests

on:
  push:
    branches: [ "main", "release" ]
    paths-ignore:
      - 'src/versions.json'
      - 'package.json'
      - 'package-lock.json'
      - 'src-tauri/tauri.conf.json'
  pull_request:
    branches: [ "main", "release" ]
    paths-ignore:
      - 'src/versions.json'
      - 'package.json'
      - 'package-lock.json'
      - 'src-tauri/tauri.conf.json'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: '22'
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # ──────────────────────────────────────────────
  # 1. lint-ts
  # ──────────────────────────────────────────────
  lint-ts:
    name: lint-ts
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci || npm install

    - name: Run Lint Check
      run: npm run lint

  # ──────────────────────────────────────────────
  # 2. lint-rust
  # ──────────────────────────────────────────────
  lint-rust:
    name: lint-rust
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust stable
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "src-tauri"

    - name: Install Linux dependencies for Tauri
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

    - name: Check Rust Formatting
      run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

    - name: Run Clippy Checks
      run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

  # ──────────────────────────────────────────────
  # 3. typecheck
  # ──────────────────────────────────────────────
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci || npm install

    - name: Run TypeScript compiler check
      run: npm run lint

  # ──────────────────────────────────────────────
  # 4. test-unit
  # ──────────────────────────────────────────────
  test-unit:
    name: test-unit
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci || npm install

    - name: Run Unit Tests with Coverage
      run: |
        npx vitest run tests/unit --coverage --coverage.reporter=json --coverage.reportsDirectory=coverage/unit
        mv coverage/unit/coverage-final.json coverage/unit/coverage-unit.json || true

    - name: Upload Unit Coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-unit
        path: coverage/unit/coverage-unit.json

  # ──────────────────────────────────────────────
  # 5. test-integration
  # ──────────────────────────────────────────────
  test-integration:
    name: test-integration
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci || npm install

    - name: Run Integration Tests with Coverage
      run: |
        npx vitest run tests/integration --coverage --coverage.reporter=json --coverage.reportsDirectory=coverage/integration
        mv coverage/integration/coverage-final.json coverage/integration/coverage-integration.json || true

    - name: Upload Integration Coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-integration
        path: coverage/integration/coverage-integration.json

  # ──────────────────────────────────────────────
  # 6. test-rust
  # ──────────────────────────────────────────────
  test-rust:
    name: test-rust
    runs-on: ubuntu-latest
    needs: [lint-rust]
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "src-tauri"

    - name: Install cargo-tarpaulin
      uses: taiki-e/install-action@cargo-tarpaulin

    - name: Install Linux dependencies for Tauri
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf lld

    - name: Run Rust Backend Tests
      env:
        RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
      run: |
        cd src-tauri
        cargo tarpaulin --out Xml --output-dir ../coverage/rust

    - name: Upload Rust Coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage-rust
        path: coverage/rust/

  # ──────────────────────────────────────────────
  # 7. coverage
  # ──────────────────────────────────────────────
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration]
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci || npm install

    - name: Download Unit Coverage
      uses: actions/download-artifact@v4
      with:
        name: coverage-unit
        path: coverage-reports/

    - name: Download Integration Coverage
      uses: actions/download-artifact@v4
      with:
        name: coverage-integration
        path: coverage-reports/

    - name: Merge and Validate Coverage Thresholds
      run: |
        npx nyc merge coverage-reports coverage-merged/coverage-final.json
        npx nyc report --temp-dir coverage-merged --reporter text --reporter json-summary
        npx nyc check-coverage --temp-dir coverage-merged --lines 70 --statements 75 --functions 75 --branches 65
      continue-on-error: true

  # ──────────────────────────────────────────────
  # 8. build
  # ──────────────────────────────────────────────
  build:
    name: build
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration, test-rust, coverage]
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci || npm install

    - name: Build Production Assets
      run: npm run build
