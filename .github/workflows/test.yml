name: Tests

on:
  push:
    branches: [main, release]

  pull_request:
    branches: [main, release]

  workflow_call:
    inputs:
      ref:
        description: "Git ref or SHA to test (defaults to the triggering ref)"
        type: string
        required: false
        default: ""

concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  RUST_WORKSPACE: "src-tauri -> target"
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # ──────────────────────────────────────────────
  # Rust lint
  # ──────────────────────────────────────────────
  lint-rust:
    name: Lint (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
          install-linux-deps: "true"

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

  # ──────────────────────────────────────────────
  # Typecheck
  # ──────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-frontend

      - name: Typecheck
        run: bun run typecheck

  # ──────────────────────────────────────────────
  # ESLint
  # ──────────────────────────────────────────────
  lint:
    name: Lint (Frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-frontend

      - name: Run ESLint
        run: bun run lint

  # ──────────────────────────────────────────────
  # Unit tests
  # ──────────────────────────────────────────────
  test-unit:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-frontend

      - name: Run Unit Tests
        run: |
          mkdir -p coverage/unit
          bun x vitest run tests/unit \
            --reporter=default \
            --reporter=github-actions \
            --reporter=json --outputFile.json=coverage/unit/test-results-unit.json \
            --reporter=junit --outputFile.junit=coverage/unit/junit.xml \
            --coverage \
            --coverage.reporter=json \
            --coverage.reporter=json-summary \
            --coverage.reportsDirectory=coverage/unit \
            --no-coverage.thresholds

          if [ -f coverage/unit/coverage-final.json ]; then
            cp coverage/unit/coverage-final.json coverage/unit/coverage-unit.json
          fi

      - name: Upload Unit Test & Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/unit/
          if-no-files-found: ignore

  # ──────────────────────────────────────────────
  # Integration tests
  # ──────────────────────────────────────────────
  test-integration:
    name: Integration Tests (Vitest)
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-frontend

      - name: Run Integration Tests
        run: |
          mkdir -p coverage/integration
          bun x vitest run tests/integration \
            --reporter=default \
            --reporter=github-actions \
            --reporter=json --outputFile.json=coverage/integration/test-results-integration.json \
            --reporter=junit --outputFile.junit=coverage/integration/junit.xml \
            --coverage \
            --coverage.reporter=json \
            --coverage.reporter=json-summary \
            --coverage.reportsDirectory=coverage/integration \
            --no-coverage.thresholds

          if [ -f coverage/integration/coverage-final.json ]; then
            cp coverage/integration/coverage-final.json coverage/integration/coverage-integration.json
          fi

      - name: Upload Integration Test & Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: coverage/integration/
          if-no-files-found: ignore

  # ──────────────────────────────────────────────
  # Rust tests + coverage
  # ──────────────────────────────────────────────
  test-rust:
    name: Tests & Coverage (Rust)
    runs-on: ubuntu-latest
    needs: [lint-rust]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-rust
        with:
          install-linux-deps: "true"

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin

      - name: Run Rust Tests + Coverage
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
        run: |
          cd src-tauri
          cargo tarpaulin \
            --fail-under 40 \
            --out Xml \
            --out Json \
            --output-dir ../coverage/rust

      - name: Upload Rust Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-rust
          path: coverage/rust/
          if-no-files-found: ignore

  # ──────────────────────────────────────────────
  # Test & Coverage Reports (GitLab Style)
  # ──────────────────────────────────────────────
  reports:
    name: Test & Coverage Reports
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    needs:
      - test-unit
      - test-integration
      - test-rust
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-frontend

      - name: Download Unit Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-unit
          path: coverage-reports/unit

      - name: Download Integration Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-integration
          path: coverage-reports/integration

      - name: Download Rust Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-rust
          path: coverage-reports/rust

      - name: Publish Test Results (Checks Tab)
        uses: dorny/test-reporter@v1
        continue-on-error: true
        with:
          name: Test Suite Results
          path: "coverage-reports/**/junit.xml"
          reporter: java-junit
          fail-on-error: false

      - name: Merge Frontend Coverage
        run: |
          mkdir -p coverage-merged
          mkdir -p coverage-flat
          find coverage-reports -name "coverage-*.json" -exec cp {} coverage-flat/ \; || true
          if [ -n "$(ls -A coverage-flat 2>/dev/null)" ]; then
            bun x nyc merge coverage-flat coverage-merged/coverage-final.json || true
          fi

      - name: Generate GitLab-Style Test & Coverage Summary
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          bun scripts/generate-ci-summary.js

      - name: Validate Coverage Thresholds
        if: hashFiles('coverage-merged/coverage-final.json') != ''
        run: |
          bun x nyc check-coverage \
            --temp-dir coverage-merged \
            --lines 40 \
            --statements 40 \
            --functions 40 \
            --branches 40

  # ──────────────────────────────────────────────
  # Build
  # ──────────────────────────────────────────────
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs:
      - test-unit
      - test-integration
      - test-rust
      - reports
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-frontend

      - name: Build Application
        run: bun run build
