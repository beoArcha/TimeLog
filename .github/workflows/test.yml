name: Tests

on:
  push:
    branches: [main, release]

  pull_request:
    branches: [main, release]

  workflow_call:
    inputs:
      ref:
        description: "Git ref or SHA to test (defaults to the triggering ref)"
        type: string
        required: false
        default: ""

concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_WORKSPACE: "src-tauri -> target"
  CARGO_PROFILE_DEV_DEBUG: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: "node24"

jobs:
  # ──────────────────────────────────────────────
  # Rust lint
  # ──────────────────────────────────────────────

  lint-rust:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.RUST_WORKSPACE }}

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

  # ──────────────────────────────────────────────
  # Typecheck
  # ──────────────────────────────────────────────

  typecheck:
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

  # ──────────────────────────────────────────────
  # ESLint
  # ──────────────────────────────────────────────

  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

  # ──────────────────────────────────────────────
  # Unit tests
  # ──────────────────────────────────────────────

  test-unit:
    runs-on: ubuntu-26.04
    needs: [typecheck, lint]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      - name: Run Unit Tests
        run: |
          bun x vitest run tests/unit \
            --coverage \
            --coverage.reporter=json \
            --coverage.reportsDirectory=coverage/unit

          mv coverage/unit/coverage-final.json coverage/unit/coverage-unit.json

      - name: Upload Unit Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/unit/coverage-unit.json

  # ──────────────────────────────────────────────
  # Integration tests
  # ──────────────────────────────────────────────

  test-integration:
    runs-on: ubuntu-26.04
    needs: [typecheck, lint]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      - name: Run Integration Tests
        run: |
          bun x vitest run tests/integration \
            --coverage \
            --coverage.reporter=json \
            --coverage.reportsDirectory=coverage/integration

          mv coverage/integration/coverage-final.json coverage/integration/coverage-integration.json

      - name: Upload Integration Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: coverage/integration/coverage-integration.json

  # ──────────────────────────────────────────────
  # Rust tests + coverage
  # ──────────────────────────────────────────────

  test-rust:
    runs-on: ubuntu-26.04
    needs: [lint-rust]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.RUST_WORKSPACE }}

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            lld

      - name: Run Rust Tests + Coverage
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=lld"

        run: |
          cd src-tauri

          cargo tarpaulin \
            --fail-under 40 \
            --out Xml \
            --out Json \
            --output-dir ../coverage/rust

      - name: Upload Rust Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-rust
          path: coverage/rust

  # ──────────────────────────────────────────────
  # Frontend coverage
  # ──────────────────────────────────────────────

  coverage:
    runs-on: ubuntu-26.04
    needs:
      - test-unit
      - test-integration

    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      - name: Download Unit Coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: coverage-reports

      - name: Download Integration Coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-integration
          path: coverage-reports

      - name: Merge Coverage
        run: |
          bun x nyc merge coverage-reports coverage-merged/coverage-final.json

      - name: Generate Report
        run: |
          bun x nyc report \
            --temp-dir coverage-merged \
            --reporter=text \
            --reporter=json-summary

      - name: Validate Thresholds
        run: |
          bun x nyc check-coverage \
            --temp-dir coverage-merged \
            --lines 40 \
            --statements 40 \
            --functions 40 \
            --branches 40

  # ──────────────────────────────────────────────
  # Build
  # ──────────────────────────────────────────────

  build:
    runs-on: ubuntu-26.04

    needs:
      - test-unit
      - test-integration
      - test-rust
      - coverage

    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      - name: Build Application
        run: bun run build
