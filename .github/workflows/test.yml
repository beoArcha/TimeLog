name: Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      
    - name: Install dependencies
      run: npm ci || npm install
      
    - name: Run linting
      run: npm run lint
      
    - name: Run JS/TS tests with coverage and Junit reporter
      run: npx vitest run --coverage --reporter=default --reporter=junit --outputFile.junit=test-results.xml
      
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/
        
    - name: Report Coverage summary
      if: always()
      uses: davelosert/vitest-coverage-report-action@v2
      
    - name: Publish Test Report
      if: always()
      uses: mikepenz/action-junit-report@v4
      with:
        report_paths: 'test-results.xml'
        
    - name: Run Rust tests
      run: |
        if [ -f "Cargo.toml" ]; then
          cargo test
        elif [ -f "src-tauri/Cargo.toml" ]; then
          cargo test --manifest-path src-tauri/Cargo.toml
        else
          echo "No Rust project found, skipping Rust tests."
        fi
