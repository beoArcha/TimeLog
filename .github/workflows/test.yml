on:
  push:
    branches: [main, release]
    paths-ignore:
      - "src/versions.json"
      - "package.json"
      - "package-lock.json"
      - "src-tauri/tauri.conf.json"

  pull_request:
    branches: [main, release]
    paths-ignore:
      - "src/versions.json"
      - "package.json"
      - "package-lock.json"
      - "src-tauri/tauri.conf.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # ──────────────────────────────────────────────
  # Rust lint
  # ──────────────────────────────────────────────

  lint-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

  # ──────────────────────────────────────────────
  # Typecheck
  # ──────────────────────────────────────────────

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  # ──────────────────────────────────────────────
  # ESLint
  # ──────────────────────────────────────────────

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ──────────────────────────────────────────────
  # Unit tests
  # ──────────────────────────────────────────────

  test-unit:
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests
        run: |
          npx vitest run tests/unit \
            --coverage \
            --coverage.reporter=json \
            --coverage.reportsDirectory=coverage/unit

          mv coverage/unit/coverage-final.json coverage/unit/coverage-unit.json

      - name: Upload Unit Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/unit/coverage-unit.json

  # ──────────────────────────────────────────────
  # Integration tests
  # ──────────────────────────────────────────────

  test-integration:
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Integration Tests
        run: |
          npx vitest run tests/integration \
            --coverage \
            --coverage.reporter=json \
            --coverage.reportsDirectory=coverage/integration

          mv coverage/integration/coverage-final.json coverage/integration/coverage-integration.json

      - name: Upload Integration Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: coverage/integration/coverage-integration.json

  # ──────────────────────────────────────────────
  # Rust tests + coverage
  # ──────────────────────────────────────────────

  test-rust:
    runs-on: ubuntu-latest
    needs: [lint-rust]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            lld

      - name: Run Rust Tests + Coverage
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=lld"

        run: |
          cd src-tauri

          cargo tarpaulin \
            --fail-under 60 \
            --out Xml \
            --out Json \
            --output-dir ../coverage/rust

      - name: Upload Rust Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-rust
          path: coverage/rust

  # ──────────────────────────────────────────────
  # Frontend coverage
  # ──────────────────────────────────────────────

  coverage:
    runs-on: ubuntu-latest
    needs:
      - test-unit
      - test-integration

    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Unit Coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: coverage-reports

      - name: Download Integration Coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-integration
          path: coverage-reports

      - name: Merge Coverage
        run: |
          npx nyc merge coverage-reports coverage-merged/coverage-final.json

      - name: Generate Report
        run: |
          npx nyc report \
            --temp-dir coverage-merged \
            --reporter=text \
            --reporter=json-summary

      - name: Validate Thresholds
        run: |
          npx nyc check-coverage \
            --temp-dir coverage-merged \
            --lines 40 \
            --statements 40 \
            --functions 40 \
            --branches 40

  # ──────────────────────────────────────────────
  # Build
  # ──────────────────────────────────────────────

  build:
    runs-on: ubuntu-latest

    needs:
      - test-unit
      - test-integration
      - test-rust
      - coverage

    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
