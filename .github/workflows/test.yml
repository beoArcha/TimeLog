name: Tests

on:
  push:
    branches: [main, release]

  pull_request:
    branches: [main, release]

  workflow_call:
    inputs:
      ref:
        description: "Git ref or SHA to test (defaults to the triggering ref)"
        type: string
        required: false
        default: ""

concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_WORKSPACE: "src-tauri -> target"
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # ──────────────────────────────────────────────
  # Rust lint
  # ──────────────────────────────────────────────
  lint-rust:
    name: Lint (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt, clippy
          install-linux-deps: "true"

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

  # ──────────────────────────────────────────────
  # Typecheck
  # ──────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-frontend

      - name: Typecheck
        run: bun run typecheck

  # ──────────────────────────────────────────────
  # ESLint
  # ──────────────────────────────────────────────
  lint:
    name: Lint (Frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-frontend

      - name: Run ESLint
        run: bun run lint

  # ──────────────────────────────────────────────
  # Unit tests
  # ──────────────────────────────────────────────
  test-unit:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-frontend

      - name: Run Unit Tests
        run: |
          bun x vitest run tests/unit \
            --coverage \
            --coverage.reporter=json \
            --coverage.reportsDirectory=coverage/unit

          mv coverage/unit/coverage-final.json coverage/unit/coverage-unit.json

      - name: Upload Unit Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/unit/coverage-unit.json

  # ──────────────────────────────────────────────
  # Integration tests
  # ──────────────────────────────────────────────
  test-integration:
    name: Integration Tests (Vitest)
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-frontend

      - name: Run Integration Tests
        run: |
          bun x vitest run tests/integration \
            --coverage \
            --coverage.reporter=json \
            --coverage.reportsDirectory=coverage/integration

          mv coverage/integration/coverage-final.json coverage/integration/coverage-integration.json

      - name: Upload Integration Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: coverage/integration/coverage-integration.json

  # ──────────────────────────────────────────────
  # Rust tests + coverage
  # ──────────────────────────────────────────────
  test-rust:
    name: Tests & Coverage (Rust)
    runs-on: ubuntu-latest
    needs: [lint-rust]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-rust
        with:
          install-linux-deps: "true"

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@cargo-tarpaulin

      - name: Run Rust Tests + Coverage
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
        run: |
          cd src-tauri
          cargo tarpaulin \
            --fail-under 40 \
            --out Xml \
            --out Json \
            --output-dir ../coverage/rust

      - name: Upload Rust Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-rust
          path: coverage/rust

  # ──────────────────────────────────────────────
  # Frontend coverage
  # ──────────────────────────────────────────────
  coverage:
    name: Coverage Verification
    runs-on: ubuntu-latest
    needs:
      - test-unit
      - test-integration
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-frontend

      - name: Download Unit Coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: coverage-reports

      - name: Download Integration Coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-integration
          path: coverage-reports

      - name: Merge Coverage
        run: |
          bun x nyc merge coverage-reports coverage-merged/coverage-final.json

      - name: Generate Report
        run: |
          bun x nyc report \
            --temp-dir coverage-merged \
            --reporter=text \
            --reporter=json-summary

      - name: Validate Thresholds
        run: |
          bun x nyc check-coverage \
            --temp-dir coverage-merged \
            --lines 40 \
            --statements 40 \
            --functions 40 \
            --branches 40

  # ──────────────────────────────────────────────
  # Build
  # ──────────────────────────────────────────────
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs:
      - test-unit
      - test-integration
      - test-rust
      - coverage
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-frontend

      - name: Build Application
        run: bun run build
