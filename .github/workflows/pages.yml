name: Deploy GitHub Pages

on:
  # Allows direct execution triggered by release.yml after publish completes
  workflow_call:
    inputs:
      ref:
        description: "Git ref or SHA to deploy"
        type: string
        required: false
        default: "release"
  # Allows manual triggers from GitHub Actions UI
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref or branch to deploy"
        type: string
        required: false
        default: "release"
  # Fallback trigger in case release workflow completes independently
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [release]

concurrency:
  group: pages-release
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy Wiki & Web App to GitHub Pages
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_call' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Checkout the target branch (default release)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'release' }}
          fetch-depth: 0

      - name: Setup Frontend
        uses: ./.github/actions/setup-frontend

      - name: Build Web Application
        run: bun run build:web

      - name: Prepare Combined Pages Site
        shell: bash
        run: |
          mkdir -p _site
          cp -r docs/wiki/* _site/
          mkdir -p _site/app
          cp -r dist/* _site/app/
          touch _site/.nojekyll

          echo "Validating Pages combined staging contents..."
          [ -s "_site/index.html" ] || { echo "::error::_site/index.html is missing or empty"; exit 1; }
          [ -s "_site/app/index.html" ] || { echo "::error::_site/app/index.html is missing or empty"; exit 1; }
          [ -s "_site/app/manifest.webmanifest" ] || { echo "::error::_site/app/manifest.webmanifest is missing or empty"; exit 1; }
          [ -f "_site/.nojekyll" ] || { echo "::error::_site/.nojekyll is missing"; exit 1; }

          echo "Verified Pages combined staging contents:"
          ls -la _site
          ls -la _site/app

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report deployment status
        shell: bash
        run: |
          {
            echo "### 🚀 GitHub Pages Deployed"
            echo ""
            echo "- **Wiki documentation**: [${{ steps.deployment.outputs.page_url }}](${{ steps.deployment.outputs.page_url }})"
            echo "- **Web application & PWA**: [${{ steps.deployment.outputs.page_url }}app/](${{ steps.deployment.outputs.page_url }}app/)"
            echo "- **Target ref**: \`${{ inputs.ref || 'release' }}\`"
            echo "- **Trigger event**: \`${{ github.event_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
