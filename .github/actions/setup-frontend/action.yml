name: Setup Frontend Environment
description: Installs Bun and restores node_modules using bun install --frozen-lockfile

inputs:
  bun-version:
    description: Bun version to install
    required: false
    default: "latest"

runs:
  using: composite
  steps:
    - name: Setup Bun
      id: setup-bun
      continue-on-error: true
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Fallback Install Bun via npm
      if: steps.setup-bun.outcome != 'success'
      shell: bash
      run: |
        echo "::warning::oven-sh/setup-bun failed (HTTP 504 or network timeout). Falling back to npm install -g bun..."
        VERSION="${{ inputs.bun-version }}"
        mkdir -p "$HOME/.npm-global"
        if [ "$VERSION" = "latest" ] || [ -z "$VERSION" ]; then
          npm install -g --prefix "$HOME/.npm-global" bun
        else
          npm install -g --prefix "$HOME/.npm-global" "bun@$VERSION"
        fi
        echo "$HOME/.npm-global/bin" >> $GITHUB_PATH
        echo "$HOME/.bun/bin" >> $GITHUB_PATH
        export PATH="$HOME/.npm-global/bin:$HOME/.bun/bin:$PATH"
        bun --version

    - name: Install Frontend Dependencies
      shell: bash
      run: bun install --frozen-lockfile
