name: Setup Rust Environment
description: Installs Rust toolchain, caching, and Linux system dependencies

inputs:
  components:
    description: Rustup components (e.g. rustfmt, clippy)
    required: false
    default: ""
  targets:
    description: Rust compilation targets
    required: false
    default: ""
  install-linux-deps:
    description: Whether to install GTK3/WebKit2GTK/lld Linux libraries needed to compile and test the Tauri crate
    required: false
    default: "false"
  install-bundling-deps:
    description: Whether to also install packages needed only by `tauri build` bundling (patchelf, librsvg2-dev). Requires install-linux-deps.
    required: false
    default: "false"
  apt-cache-version:
    description: Bump to invalidate the cached APT package set
    required: false
    default: "1"
  workspaces:
    description: Workspaces for Swatinem/rust-cache
    required: false
    default: "src-tauri -> target"
  shared-key:
    description: Swatinem/rust-cache shared key; jobs with the same key, toolchain and CARGO_*/RUST* env share one cache
    required: false
    default: "tauri-ci"
  cache-save-if:
    description: Whether the Rust build cache is saved after the job. Defaults to main-branch runs only so PRs restore but never write caches.
    required: false
    default: ${{ github.ref == 'refs/heads/main' }}

runs:
  using: composite
  steps:
    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ inputs.workspaces }}
        shared-key: ${{ inputs.shared-key }}
        save-if: ${{ inputs.cache-save-if }}

    # lld is installed for every caller: RUSTFLAGS="-C link-arg=-fuse-ld=lld" is set by test-rust, build-tauri and verify-release.
    - name: Install Linux Dependencies
      if: inputs.install-linux-deps == 'true' && runner.os == 'Linux'
      uses: awalsh128/cache-apt-pkgs-action@v1.6.3
      with:
        packages: >-
          pkg-config
          libgtk-3-dev
          libwebkit2gtk-4.1-dev
          libappindicator3-dev
          lld
          ${{ inputs.install-bundling-deps == 'true' && 'patchelf librsvg2-dev' || '' }}
        version: ${{ inputs.apt-cache-version }}
