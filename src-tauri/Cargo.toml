[package]
name = "oxy-flow"
version = "0.2.0"
edition = "2021"
authors = ["OxyFlow Team"]
description = "Lightweight work-timer built with Tauri v2 speed, SQLite, and a background system tray daemon."

[dependencies]
# Tauri integration (extremely lightweight webview frame + Rust backend commands)
tauri = { version = "2.0.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Local SQLite MicroORM
rusqlite = { version = "0.31.0", features = ["bundled", "chrono"] }
chrono = { version = "0.4.38", features = ["serde"] }

# System stats & CLI
comfy-table = "7.1"
clap = { version = "4.5", features = ["derive"] }

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }
