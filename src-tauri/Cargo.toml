[package]
name = "oxyflow-timelog"
default-run = "timelog"
version = "1.15.4"
edition = "2021"
description = "oXyFlow TimeLog — Lightweight, local-first work timer and task tracker built with Rust, Tauri v2, SQLite, and React 19."
authors = ["Marcin 'beoArcha' Stefan"]
license = "MPL-2.0"

[[bin]]
name = "timelog"
path = "src/main.rs"

[[bin]]
name = "oxy"
path = "src/bin/oxy.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Tauri integration (extremely lightweight webview frame + Rust backend commands)
tauri = { version = "2.0.0", features = ["tray-icon", "devtools"] }

chrono = { version = "0.4.38", features = ["serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
# Local SQLite MicroORM
rusqlite = { version = "0.31.0", features = ["bundled", "chrono", "backup"] }

clap = { version = "4.5", features = ["derive"] }
# System stats & CLI
comfy-table = "7.1"
csv = "1.3"
env_logger = "0.11"
log = "0.4"
sys-locale = "0.3"
thiserror = "2.0"
ts-rs = { version = "10.0", features = ["chrono-impl"] }
uuid = { version = "1.8", features = ["serde", "v4"] }
quick-xml = { version = "0.42.0", features = ["serialize"] }
rust_xlsxwriter = "0.102.0"
spreadsheet-ods = "1.0.4"
unicode-width = "0.2"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dev-dependencies]
calamine = "0.38"
tempfile = "3.17"


