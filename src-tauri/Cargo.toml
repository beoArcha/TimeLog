[package]
name = "oxy-flow"
version = "1.10.1"
edition = "2021"
description = "Lightweight work-timer built with Tauri v2 speed, SQLite, and a background system tray daemon."
license = "MPL-2.0"

[[bin]]
name = "oxy-flow"
path = "src/main.rs"

[[bin]]
name = "oxy"
path = "src/bin/oxy.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Tauri integration (extremely lightweight webview frame + Rust backend commands)
tauri = { version = "2.0.0", features = ["tray-icon", "devtools"] }

chrono = { version = "0.4.38", features = ["serde"] }
# Local SQLite MicroORM
rusqlite = { version = "0.31.0", features = ["bundled", "chrono", "backup"] }

clap = { version = "4.5", features = ["derive"] }
# System stats & CLI
comfy-table = "7.1"
csv = "1.3"
sys-locale = "0.3"
thiserror = "2.0"
ts-rs = { version = "10.0", features = ["chrono-impl"] }
uuid = { version = "1.8", features = ["serde", "v4"] }

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }
